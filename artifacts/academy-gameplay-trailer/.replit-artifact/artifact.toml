kind = "video"
videoAspectRatio = "16:9"
previewPath = "/academy-gameplay-trailer/"
title = "TheeAcademy — Gameplay Trailer"
description = "A 15-minute, 16:9 gameplay trailer built from live screen recordings of TheeAcademy’s desktop game and running Expo mobile companion."
version = "1.0.0"
id = "artifacts/academy-gameplay-trailer"
router = "path"

[[services]]
name = "web"
paths = [ "/academy-gameplay-trailer/" ]
localPort = 18694

[services.development]
run = "pnpm --filter @workspace/academy-gameplay-trailer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/academy-gameplay-trailer", "run", "build" ]
serve = "static"
publicDir = "artifacts/academy-gameplay-trailer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18694"
BASE_PATH = "/academy-gameplay-trailer/"
