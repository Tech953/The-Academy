kind = "video"
videoAspectRatio = "16:9"
previewPath = "/academy-gameplay-trailer/"
title = "The Academy — Gameplay Trailer"
description = "A five-minute, 16:9 gameplay trailer for The Academy, introducing its character creation, campus exploration, NPC relationships, learning systems, and progression for YouTube and Buildathon promotion."
version = "1.0.0"
id = "artifacts/academy-gameplay-trailer"
router = "path"

[[services]]
name = "web"
paths = [ "/academy-gameplay-trailer/" ]
localPort = 18694

[services.development]
run = "pnpm --filter @workspace/academy-gameplay-trailer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/academy-gameplay-trailer", "run", "build" ]
serve = "static"
publicDir = "artifacts/academy-gameplay-trailer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18694"
BASE_PATH = "/academy-gameplay-trailer/"
