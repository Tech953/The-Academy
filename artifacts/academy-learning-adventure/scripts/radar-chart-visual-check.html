<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar chart visual check</title>
    <style>
      html,
      body,
      #root {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #e2e8f0;
        color: #0f172a;
        font-family: Inter, system-ui, sans-serif;
      }

      .visual-check-page {
        box-sizing: border-box;
        display: grid;
        grid-template-rows: 58px minmax(0, 1fr);
        gap: 12px;
        width: 1920px;
        height: 1080px;
        padding: 28px;
      }

      .visual-check-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0;
        font-size: 28px;
        line-height: 1;
      }

      .visual-check-heading small {
        color: #475569;
        font-size: 18px;
        font-weight: 500;
      }

      .radar-chart-frame {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 2px solid #64748b;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import RadarChartVisualCheck from './radar-chart-visual-check.tsx';

      createRoot(document.getElementById('root')).render(
        React.createElement(RadarChartVisualCheck),
      );
    </script>
  </body>
</html>
